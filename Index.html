<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Motivación</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            font-family: 'Poppins', sans-serif;
            text-align: center;
        }

        
        #motivateBtn {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        #motivateBtn:hover {
            transform: scale(1.05);
        }

        
        #reward {
            display: none;
        }

        
        #catGif {
            max-width: 300px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        
        #motivationalText {
            font-size: 32px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>
<body>


    <button id="motivateBtn">aprietame</button>

     
    <div id="reward">
        
        <img id="catGif" src="https://tenor.com/view/cat-cute-happy-jumping-gif-26555219" alt="Gato saltando">
        <p id="motivationalText">ANIMO MI AMOR TU PUEDES CON TODOOOO, TODO EL ESCUADRON SMOL TE ESTA APOYANDO</p>
    </div>

    <script>
        const btn = document.getElementById('motivateBtn');
        const reward = document.getElementById('reward');

        
        btn.addEventListener('click', function() {
            
            btn.style.display = 'none';
            
            reward.style.display = 'block';
        });
    </script>

</body>
</html>
